# The same two services on a host without a GPU: llama.cpp's CPU image, and our service on the
# CPU too (it runs no model, so that costs nothing).
#
#   docker compose -f docker-compose.yml -f docker-compose.llama-cpu.yml up -d
services:
  typecastlm:
    deploy: !reset {}
    environment:
      TYPECASTLM_BACKEND: llama
      TYPECASTLM_BACKEND_ENDPOINT: http://llama:8080
      TYPECASTLM_MODEL: ${TYPECASTLM_MODEL:-mihailgribov/typecastlm-qwen3.5-3.8b-gguf}
      TYPECASTLM_DEVICE: cpu
    depends_on:
      llama:
        condition: service_healthy

  llama:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: typecastlm-llama
    restart: unless-stopped
    command: ["-hf", "${LLAMA_GGUF:-mihailgribov/typecastlm-qwen3.5-3.8b-gguf:Q8_0}",
              "--embeddings", "-c", "${LLAMA_CTX:-8192}", "-b", "${LLAMA_UBATCH:-2048}",
              "-ub", "${LLAMA_UBATCH:-2048}", "--port", "8080", "--host", "0.0.0.0",
              "--parallel", "${LLAMA_PARALLEL:-1}", "--kv-unified",
              "-t", "${LLAMA_THREADS:-8}"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_CACHE: /data/cache
    volumes:
      - ${LLAMA_CACHE_DIR:-llama-cache}:/data/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 1800s

volumes:
  llama-cache:
