[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typecastlm"
version = "1.1.1"
description = "Client for a Jev-class decision model with open weights: the same noul, choice and score interface, plus a fourth mode that answers yes, no, or nothing here decides it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Gribov", email = "mihail.gribov.rs@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["decision-model", "jev-class", "classifier", "zero-shot", "calibration", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# One dependency, and it stays that way. The model runs as a service; the machine that has a
# question should not have to install a deep-learning stack to ask it.
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# Running the model in your own process. The client needs none of this.
local = [
    "torch>=2.2",
    "transformers>=4.51",
    "huggingface-hub>=0.24",
]
# Everything heavy lives here and only here: the server holds the weights, the client
# knows nothing about them.
server = [
    "torch>=2.2",
    "transformers>=4.51",
    "huggingface-hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = ["pytest>=8"]

[project.scripts]
typecastlm = "typecastlm.cli:main"
typecastlm-serve = "typecastlm.server:main"

[project.urls]
Homepage = "https://github.com/mihail-gribov/typecastlm"
Source = "https://github.com/mihail-gribov/typecastlm"
Model = "https://huggingface.co/mihailgribov/typecastlm-qwen3.5-3.8b"

[tool.hatch.build.targets.wheel]
packages = ["src/typecastlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
