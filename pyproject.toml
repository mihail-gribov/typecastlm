[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typecastlm"
version = "0.1.0"
description = "Ask a document a closed question and get probabilities back: yes, no, and nothing-here-decides-it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Gribov", email = "mihail.gribov.rs@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["classifier", "zero-shot", "yes-no", "calibration", "prompt-injection", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# One dependency, and it stays that way. The model runs as a service; the machine that has a
# question should not have to install a deep-learning stack to ask it.
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# Всё тяжёлое — здесь и только здесь: сервер держит веса, клиент о них не знает.
server = [
    "torch>=2.2",
    "transformers>=4.51",
    "huggingface-hub>=0.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = ["pytest>=8"]

[project.scripts]
typecastlm = "typecastlm.cli:main"
typecastlm-serve = "typecastlm.server:main"

[project.urls]
Homepage = "https://huggingface.co/mihailgribov/qwen3-layer30-reader"

[tool.hatch.build.targets.wheel]
packages = ["src/typecastlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
