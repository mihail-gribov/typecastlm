# The service on one GPU. Copy .env.example to .env, set the key, then:
#
#   docker compose pull && docker compose up -d      # the published image
#   docker compose up -d --build                     # or built here, from this checkout
#   curl localhost:8000/health
#
# Needs nvidia-container-toolkit on the host (docs/DOCKER.md). Without a GPU, add the CPU file:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
services:
  typecastlm:
    # The published image; `docker compose pull` fetches it. `--build` builds the same thing
    # from this checkout instead, under the same name.
    image: ${IMAGE:-ghcr.io/mihail-gribov/typecastlm}:${IMAGE_TAG:-latest}
    build: .
    container_name: typecastlm
    restart: unless-stopped
    ports:
      # Bound to localhost by default: without a key the service answers anyone who reaches it.
      - "${BIND:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      TYPECASTLM_PORT: "8000"                  # the container side; PORT above is the host side
      TYPECASTLM_MODEL: ${TYPECASTLM_MODEL:-mihailgribov/typecastlm-qwen3.5-3.8b}
      TYPECASTLM_API_KEY: ${TYPECASTLM_API_KEY:-}
      TYPECASTLM_QUEUE: ${TYPECASTLM_QUEUE:-32}
      TYPECASTLM_DTYPE: ${TYPECASTLM_DTYPE:-bfloat16}
      TYPECASTLM_MAX_STATE_TOKENS: ${TYPECASTLM_MAX_STATE_TOKENS:-}
      TYPECASTLM_DEVICE: ${TYPECASTLM_DEVICE:-auto}
      TYPECASTLM_BACKEND: ${TYPECASTLM_BACKEND:-local}
      TYPECASTLM_BACKEND_ENDPOINT: ${TYPECASTLM_BACKEND_ENDPOINT:-}   # empty: the backend's own default
      TYPECASTLM_BACKEND_KEY: ${TYPECASTLM_BACKEND_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # a llama-server on this machine, outside Docker
    volumes:
      # The Hub cache: the checkpoint is downloaded once and survives rebuilds and restarts.
      - hf-cache:/data/hf
      # Your own copy of the weights, if you have one: set TYPECASTLM_MODEL=/models/<dir>.
      - ${MODELS_DIR:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 20s

volumes:
  hf-cache:
